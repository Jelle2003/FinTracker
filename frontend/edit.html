<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0f1a">
    <title>Uitgave bewerken · FINTRACK</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="app-shell">
    <header class="site-header">
        <div class="site-nav">
            <a href="{{ url_for('index') }}" class="brand-mark"><span>FIN</span>TRACK</a>
            <button class="menu-toggle" type="button" aria-label="Menu openen" aria-expanded="false" aria-controls="primary-nav">
                <span></span><span></span><span></span>
            </button>
            <nav id="primary-nav" class="primary-nav">
                <a href="{{ url_for('index') }}">Overzicht</a>
                <div class="nav-group">
                    <span class="nav-group-label">Beheer</span>
                    <a href="{{ url_for('income') }}">Inkomsten</a>
                    <a href="{{ url_for('expenses') }}">Uitgaven</a>
                </div>
                <a href="{{ url_for('investing') }}">Beleggen</a>
                <a href="{{ url_for('market') }}">Markt & Nieuws</a>
                <a href="{{ url_for('ai_investor') }}">AI Adviseur</a>
                <a href="{{ url_for('account') }}">Account</a>
                <form method="post" action="{{ url_for('logout') }}" class="nav-logout-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="nav-logout">Afmelden</button>
                </form>
            </nav>
        </div>
    </header>

    <div class="form-page">
        <div class="page-heading">
            <div>
                <p class="page-eyebrow">BEHEER · UITGAVEN</p>
                <h1>Uitgave bewerken</h1>
                <p>Pas de gegevens aan en sla je wijzigingen op.</p>
            </div>
            <a class="page-back-link" href="{{ url_for('expenses') }}">← Terug naar uitgaven</a>
        </div>

        <section class="form-card">
            <form method="post" action="{{ url_for('edit_post', expense_id=expense.id) }}" class="app-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-field">
                    <label for="description">Omschrijving</label>
                    <input id="description" name="description" value="{{ expense.description }}" required maxlength="200" autocomplete="off">
                </div>

                <div class="form-grid-2">
                    <div class="form-field">
                        <label for="amount">Bedrag</label>
                        <div class="input-prefix"><span>€</span><input id="amount" type="number" step="0.01" min="0.01" name="amount" value="{{ '%.2f'|format(expense.amount) }}" required></div>
                    </div>
                    <div class="form-field">
                        <label for="date">Datum</label>
                        <input id="date" type="date" name="date" value="{{ expense.date.strftime('%Y-%m-%d') if expense.date else today }}" required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="category">Categorie</label>
                    <select id="category" name="category" required>
                        {% for c in categories %}
                            <option value="{{ c }}" {% if expense.category == c %}selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-actions">
                    <button class="form-primary-button" type="submit">Wijzigingen opslaan <span aria-hidden="true">→</span></button>
                    <a class="form-secondary-button" href="{{ url_for('expenses') }}">Annuleren</a>
                </div>
            </form>
        </section>
    </div>
</main>
<script nonce="{{ g.csp_nonce }}">
(() => {
    const toggle = document.querySelector(".menu-toggle");
    const nav = document.getElementById("primary-nav");
    if (!toggle || !nav) return;
    toggle.addEventListener("click", () => {
        const open = toggle.getAttribute("aria-expanded") === "true";
        toggle.setAttribute("aria-expanded", String(!open));
        toggle.setAttribute("aria-label", open ? "Menu openen" : "Menu sluiten");
        nav.classList.toggle("is-open", !open);
    });
    nav.querySelectorAll("a").forEach(a => {
        if (a.pathname === location.pathname) a.classList.add("is-active");
    });
})();
</script>
</body>
</html>
